[project]
name = "email-to-pdf"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.136.0",
    "playwright>=1.58.0",
    "uvicorn>=0.44.0",
    "extract-msg>=0.48",
    "nh3>=0.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "chardet>=5.0",
    "structlog>=24.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "typer>=0.12",
    "python-multipart>=0.0.26",
    "code-review-graph>=2.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "code-review-graph",
]

[project.scripts]
email-to-pdf = "email_to_pdf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
