[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-to-pdf"
version = "0.1.0"
description = "Convert .eml and .msg email files to PDF"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
keywords = ["email", "pdf", "eml", "msg", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Multimedia",
]
dependencies = [
    "anyio>=4.0",
    "playwright>=1.58.0",
    "extract-msg>=0.48",
    "nh3>=0.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "chardet>=5.0",
    "structlog>=24.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "typer>=0.12",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "python-multipart>=0.0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "code-review-graph",
]

[project.scripts]
email-to-pdf = "email_to_pdf.cli:main"

[project.urls]
Homepage = "https://github.com/duhbinci/email-to-pdf"
Repository = "https://github.com/duhbinci/email-to-pdf"
Issues = "https://github.com/duhbinci/email-to-pdf/issues"

[tool.hatch.build.targets.wheel]
packages = ["email_to_pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
